<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Architecture Diagram Preview</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #111111;
      }

      main {
        display: grid;
        place-items: center;
        width: 100vw;
        height: 100vh;
      }

      img {
        display: block;
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        object-fit: contain;
        background: #fdfae7;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./architecture-diagram.svg" alt="AI PR Review Assistant architecture diagram" />
    </main>
  </body>
</html>
