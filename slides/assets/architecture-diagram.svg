<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">AI PR Review Assistant Architecture</title>
  <desc id="desc">Architecture diagram showing React frontend, Express backend, GitHub API, review context builder, AI review loop, RightCode LLM API, and SSE streaming back to the browser.</desc>
  <defs>
    <style>
      .bg { fill: #fdfae7; }
      .panel { fill: rgba(30, 43, 250, 0.045); stroke: rgba(30, 43, 250, 0.24); stroke-width: 2; }
      .card { fill: rgba(255, 255, 255, 0.64); stroke: rgba(30, 43, 250, 0.28); stroke-width: 2; }
      .external { fill: rgba(30, 43, 250, 0.08); stroke: rgba(30, 43, 250, 0.38); stroke-width: 2; stroke-dasharray: 10 8; }
      .primary { fill: #1e2bfa; }
      .text { fill: #111111; font-family: "Space Grotesk", "Noto Sans SC", sans-serif; font-weight: 700; }
      .body { fill: #666666; font-family: "Inter", "Noto Sans SC", sans-serif; font-weight: 500; }
      .small { fill: #777777; font-family: "Inter", "Noto Sans SC", sans-serif; font-weight: 500; }
      .mono { fill: #1e2bfa; font-family: "Space Grotesk", "Noto Sans SC", sans-serif; font-weight: 700; letter-spacing: 1px; }
      .arrow { stroke: #1e2bfa; stroke-width: 4; fill: none; marker-end: url(#arrowHead); }
      .arrow-soft { stroke: rgba(30, 43, 250, 0.42); stroke-width: 3; fill: none; marker-end: url(#arrowHeadSoft); }
      .sse { stroke: #059669; stroke-width: 5; fill: none; stroke-dasharray: 14 10; marker-end: url(#arrowHeadGreen); }
      .green { fill: #059669; }
      .muted-line { stroke: rgba(30, 43, 250, 0.16); stroke-width: 2; }
    </style>
    <marker id="arrowHead" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10 Z" fill="#1e2bfa"/>
    </marker>
    <marker id="arrowHeadSoft" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10 Z" fill="rgba(30, 43, 250, 0.42)"/>
    </marker>
    <marker id="arrowHeadGreen" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10 Z" fill="#059669"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1e2bfa" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect class="bg" width="1920" height="1080"/>
  <circle cx="1605" cy="178" r="110" fill="rgba(30, 43, 250, 0.055)"/>
  <circle cx="1605" cy="178" r="62" fill="none" stroke="rgba(30, 43, 250, 0.22)" stroke-width="2"/>
  <circle cx="318" cy="884" r="150" fill="none" stroke="rgba(30, 43, 250, 0.14)" stroke-width="2"/>

  <rect x="96" y="74" width="96" height="6" rx="3" class="primary"/>
  <text x="96" y="128" class="mono" font-size="20">ARCHITECTURE</text>
  <text x="96" y="194" class="text" font-size="58">AI PR Review Assistant</text>
  <text x="96" y="242" class="body" font-size="28">从 GitHub PR URL 到可视化 AI Review Pipeline</text>

  <!-- Frontend boundary -->
  <rect x="96" y="322" width="430" height="510" rx="28" class="panel" filter="url(#shadow)"/>
  <text x="132" y="378" class="mono" font-size="18">FRONTEND</text>
  <text x="132" y="426" class="text" font-size="36">React Web App</text>
  <text x="132" y="468" class="body" font-size="22">Vite / TypeScript / Tailwind</text>

  <rect x="132" y="510" width="358" height="76" rx="16" class="card"/>
  <text x="160" y="558" class="text" font-size="24">PR URL Input</text>
  <text x="160" y="584" class="small" font-size="16">用户输入 GitHub Pull Request URL</text>

  <rect x="132" y="612" width="358" height="76" rx="16" class="card"/>
  <text x="160" y="660" class="text" font-size="24">Patch Viewer</text>
  <text x="160" y="686" class="small" font-size="16">展示 changed files 和 diff</text>

  <rect x="132" y="714" width="358" height="76" rx="16" class="card"/>
  <text x="160" y="762" class="text" font-size="24">Agent Timeline</text>
  <text x="160" y="788" class="small" font-size="16">实时展示 loop action 和结果</text>

  <!-- Backend boundary -->
  <rect x="662" y="292" width="664" height="590" rx="32" class="panel" filter="url(#shadow)"/>
  <text x="704" y="350" class="mono" font-size="18">BACKEND</text>
  <text x="704" y="398" class="text" font-size="38">Express API Server</text>
  <text x="704" y="440" class="body" font-size="22">Node.js / TypeScript / SSE</text>

  <rect x="704" y="486" width="260" height="96" rx="18" class="card"/>
  <text x="732" y="530" class="text" font-size="24">GitHub Routes</text>
  <text x="732" y="560" class="small" font-size="17">parse URL / metadata / files</text>

  <rect x="1024" y="486" width="260" height="96" rx="18" class="card"/>
  <text x="1052" y="530" class="text" font-size="24">Review Routes</text>
  <text x="1052" y="560" class="small" font-size="17">context / stream endpoint</text>

  <rect x="704" y="628" width="260" height="116" rx="18" class="card"/>
  <text x="732" y="674" class="text" font-size="24">Context Builder</text>
  <text x="732" y="704" class="small" font-size="17">过滤 low-value 文件</text>
  <text x="732" y="728" class="small" font-size="17">截断长 patch / 标记大 PR</text>

  <rect x="1024" y="628" width="260" height="116" rx="18" class="card"/>
  <text x="1052" y="674" class="text" font-size="24">Review Pipeline</text>
  <text x="1052" y="704" class="small" font-size="17">fetch → context → loop</text>
  <text x="1052" y="728" class="small" font-size="17">统一产出 summary / risks</text>

  <rect x="862" y="782" width="264" height="70" rx="18" class="card"/>
  <text x="904" y="826" class="text" font-size="24">SSE Event Stream</text>

  <!-- AI loop -->
  <rect x="1428" y="332" width="396" height="500" rx="32" class="panel" filter="url(#shadow)"/>
  <text x="1470" y="390" class="mono" font-size="18">AI CONTROL LAYER</text>
  <text x="1470" y="438" class="text" font-size="38">Review Loop</text>
  <text x="1470" y="480" class="body" font-size="22">结构化 action 协议</text>

  <rect x="1470" y="528" width="312" height="56" rx="28" class="card"/>
  <circle cx="1498" cy="556" r="13" class="primary"/>
  <text x="1528" y="565" class="text" font-size="22">inspect_files</text>

  <rect x="1470" y="604" width="312" height="56" rx="28" class="card"/>
  <circle cx="1498" cy="632" r="13" class="primary"/>
  <text x="1528" y="641" class="text" font-size="22">record_risk</text>

  <rect x="1470" y="680" width="312" height="56" rx="28" class="card"/>
  <circle cx="1498" cy="708" r="13" class="primary"/>
  <text x="1528" y="717" class="text" font-size="22">record_suggestion</text>

  <rect x="1470" y="756" width="312" height="56" rx="28" class="card"/>
  <circle cx="1498" cy="784" r="13" class="primary"/>
  <text x="1528" y="793" class="text" font-size="22">finish</text>

  <!-- External services -->
  <rect x="1038" y="94" width="306" height="114" rx="24" class="external"/>
  <text x="1080" y="144" class="text" font-size="28">GitHub REST API</text>
  <text x="1080" y="178" class="small" font-size="18">PR metadata / files / patch</text>

  <rect x="1428" y="94" width="344" height="114" rx="24" class="external"/>
  <text x="1470" y="144" class="text" font-size="28">RightCode API</text>
  <text x="1470" y="178" class="small" font-size="18">LLM response / model switch</text>

  <!-- Data flow arrows -->
  <path d="M526 544 C585 544 604 544 662 544" class="arrow"/>
  <text x="548" y="516" class="small" font-size="18">HTTP API</text>

  <path d="M834 486 C880 362 1134 330 1191 208" class="arrow-soft"/>
  <text x="974" y="296" class="small" font-size="18">fetch PR data</text>

  <path d="M964 686 C994 686 994 686 1024 686" class="arrow-soft"/>
  <path d="M1154 628 C1154 604 1154 604 1154 582" class="arrow-soft"/>
  <path d="M1284 686 C1348 686 1368 582 1428 582" class="arrow"/>
  <text x="1332" y="548" class="small" font-size="18">prompt + state</text>

  <path d="M1626 332 C1626 262 1626 246 1626 208" class="arrow-soft"/>
  <text x="1648" y="276" class="small" font-size="18">LLM call</text>

  <path d="M1428 738 C1370 782 1308 817 1126 817" class="arrow"/>
  <text x="1252" y="820" class="small" font-size="18">validated action</text>

  <path d="M862 817 C706 914 500 934 310 832" class="sse"/>
  <text x="548" y="938" class="green" font-family="Space Grotesk, Noto Sans SC, sans-serif" font-size="22" font-weight="700">SSE: step / heartbeat / loop_action / result / done</text>

  <!-- Guardrail annotations -->
  <line x1="1376" y1="330" x2="1376" y2="832" class="muted-line"/>
  <rect x="1200" y="908" width="564" height="92" rx="20" fill="rgba(5, 150, 105, 0.08)" stroke="rgba(5, 150, 105, 0.28)" stroke-width="2"/>
  <text x="1238" y="948" class="text" font-size="24">Guardrails</text>
  <text x="1238" y="978" class="small" font-size="18">未 inspect 文件不能记录风险 · suggestion 必须引用 riskId · 0 risk finish 触发二次检查</text>
</svg>
